<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万象录 · 世界观工作台</title><link rel="stylesheet" href="./style.css"><body><aside><h2>◈ 万象录</h2><small>WORLD BUILDING STUDIO</small><label for="world">我的世界</label><input id="world" maxlength="80"><nav id="nav"></nav><p class="motto">一念开天地，一笔记万象。</p></aside><main><header><div><small>你的玄幻修仙世界</small><h1 id="heading">全部设定</h1><p>从天地初开，到万物有序。记录每一处想象。</p></div><button class="primary" id="new">＋ 新建设定</button></header><section class="tools"><input id="search" type="search" placeholder="搜索标题或正文…" aria-label="搜索设定"><button id="export">导出备份</button><button id="import">导入备份</button><input id="file" type="file" accept=".json,application/json" hidden></section><div class="workspace"><section><p id="count"></p><div id="list"></div></section><section class="editor"><div id="empty"><span>✧</span><h2>为你的世界，写下第一笔</h2><p>点击新建设定，记录起源、山川、宗门与天道。</p></div><form id="form" hidden><div class="editor-head">设定编辑 <span id="saved" role="status"></span></div><label for="title">设定标题</label><input id="title" maxlength="160" placeholder="例如：天地初开与灵气的起源"><div class="fields"><div><label for="category">所属分类</label><select id="category"></select></div><div><label for="status">完善程度</label><select id="status"><option>构思中</option><option>待完善</option><option>已定稿</option></select></div></div><label for="content">设定正文</label><textarea id="content" placeholder="写下已确定的设定，也可以保留尚未成形的灵感与疑问。"></textarea><footer><span id="words"></span><button type="button" id="delete">删除设定</button></footer></form></section></div><p class="note">内容自动保存在当前浏览器；清除浏览器数据会丢失内容。请定期导出备份，跨设备时可导入。</p><p id="notice" role="status" aria-live="polite"></p></main><script type="module" src="./app.js"></script></body></html>
