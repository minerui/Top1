<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万象录 · 世界观工作台</title><link rel="stylesheet" href="./style.css"><body><div class="topbar"><div class="brand">◈ 万象录<span>玄幻修仙 · 世界观工作台</span></div><div class="world-field"><label for="world">我的世界</label><input id="world" maxlength="80" aria-label="世界名称"></div></div><nav id="nav" aria-label="世界观四大模块"></nav><main><header><div><small>你的玄幻修仙世界</small><h1 id="heading">天地</h1><p id="description">世界在哪里</p></div><button class="primary" id="new">＋ 新建设定</button></header><section class="tools"><input id="search" type="search" placeholder="搜索标题或正文…" aria-label="搜索设定"><button id="export">导出备份</button><button id="import">导入备份</button><input id="file" type="file" accept=".json,application/json" hidden></section><div class="workspace"><section><p id="count"></p><div id="list"></div></section><section class="editor"><div id="empty"><span>✧</span><h2 id="empty-title">为天地写下第一条设定</h2><p id="empty-description">点击“新建设定”，开始记录世界在哪里。</p></div><form id="form" hidden><div class="editor-head">设定编辑 <span id="saved" role="status"></span></div><label for="title">设定标题</label><input id="title" maxlength="160" placeholder="为这条设定起一个名字"><div class="fields"><div><label for="category">所属模块</label><select id="category"></select></div><div><label for="status">完善程度</label><select id="status"><option>构思中</option><option>待完善</option><option>已定稿</option></select></div></div><label for="content">设定正文</label><textarea id="content" placeholder="写下已确定的设定，也可以保留尚未成形的灵感与疑问。"></textarea><footer><span id="words"></span><button type="button" id="delete">删除设定</button></footer></form></section></div><p class="note">内容自动保存在当前浏览器；清除浏览器数据会丢失内容。请定期导出备份，跨设备时可导入。</p><p id="notice" role="status" aria-live="polite"></p></main><script type="module" src="./app.js"></script></body></html>
